<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!-- Força o modo tela cheia no iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ACS Digital">
<!-- Ícone para a tela de início do iPad -->
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2966/2966327.png">
  <meta charset="UTF-8">
  <title>Detalhe da Família</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<button class="btn-hamburger" id="btnHamburger" onclick="toggleSidebar()">☰</button>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="fecharSidebar()"></div>

<aside class="sidebar">
  <div class="logo">💚 ACS Digital</div>
  <nav>
    <button onclick="window.location.href='index.html'" id="btn_inicio">🏠 Painel inicial</button>
    <button onclick="window.location.href='notificacoes.html'" id="btn_notif" style="position:relative;">🔔 Notificações <span id="badgeNotif" style="display:none;background:#e53e3e;color:white;font-size:10px;font-weight:bold;border-radius:99px;padding:1px 6px;margin-left:4px;">0</span></button>
    <div class="nav-divisor"></div>
    <div class="nav-grupo">
      <button class="nav-grupo-btn" id="btn_familias" onclick="toggleGrupo('familias')"><span>👨‍👩‍👧 Famílias e Cidadãos</span><span class="seta">›</span></button>
      <div class="nav-submenu" id="sub_familias">
        <button onclick="window.location.href='familias_lista.html'">📋 Lista de Famílias</button>
        <button onclick="window.location.href='familias.html'">➕ Nova Família</button>
        <button onclick="window.location.href='cidadaos_lista.html'">👤 Cidadãos</button>
        <button onclick="window.location.href='vacinacao.html'">💉 Vacinação</button>
        <button onclick="window.location.href='bolsa_familia.html'">💰 Bolsa Família</button>

    </div>
    <div class="nav-grupo">

      <div class="nav-submenu" id="sub_visitas">
        <button onclick="window.location.href='visitas_lista.html'">📋 Histórico de Visitas</button>

        <button onclick="window.location.href='pendencias.html'">⚠️ Pendências</button>
      </div>
    </div>
    <div class="nav-grupo">

        <button onclick="window.location.href='metas.html'">🎯 Metas Brasil 360</button>
      </div>

    <div class="nav-grupo">

      <div class="nav-submenu" id="sub_planejamento">
        <button onclick="window.location.href='agenda.html'">📅 Agenda</button>
        <button onclick="window.location.href='calendario.html'">📆 Calendário</button>
        <button onclick="window.location.href='percurso.html'">🚶 Percurso do Dia</button>
        <button onclick="window.location.href='mapa.html'">🗺️ Mapa da Microárea</button>
      </div>
    </div>
    <div class="nav-divisor"></div>
    <div class="nav-grupo">
      <button class="nav-grupo-btn" id="btn_config" onclick="toggleGrupo('config')"><span>⚙️ Configurações</span><span class="seta">›</span></button>
      <div class="nav-submenu" id="sub_config">
        <button onclick="window.location.href='configuracoes.html'">⚙️ Meu Perfil e Backup</button>
        <button onclick="window.location.href='importador.html'">📥 Importar CSV</button>
        <button onclick="window.location.href='pin.html'">🔒 Alterar PIN</button>

  <div class="user">
    <img id="sidebarFotoPerfil" src="gabriela.jpg" alt="Foto" style="width:40px;height:40px;min-width:40px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.25);flex-shrink:0;">
    <div><strong id="sidebarNomePerfil">Gabriela Almeida</strong><span id="sidebarMicroarea">Microárea 03</span></div>
  </div>

<div class="main">
  <div class="page-actions">
    <h1>Detalhes da família</h1>
    <div class="page-actions-btns">
      <button onclick="window.location.href='index.html'" class="btn btn-home">🏠 Início</button>
      <button onclick="window.history.back()" class="btn btn-secondary">⬅️ Voltar</button>
    </div>
  </div>

  <div id="dadosFamilia" class="box"></div>

  <div class="box">
    <h3>Membros da família</h3>
    <div id="listaMembros"></div>
  </div>

  <div class="box" style="margin-top: 20px; border-top: 4px solid #3182ce;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #edf2f7; padding-bottom: 10px;">
      <h3 style="margin: 0; color: #2c5282;">📋 Histórico de Visitas</h3>
      <button id="btnNovaVisitaDetalhe" class="btn btn-success" style="font-size: 13px; padding: 7px 14px;">▶ Nova Visita</button>
    </div>
    <div id="historicoVisitasFamilia"></div>
  </div>

</div>

<script src="script.js"></script>

</html>
