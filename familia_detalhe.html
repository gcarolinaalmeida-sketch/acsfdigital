<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Detalhe da Família - ACS Digital</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

    <div class="app-container">
        
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon"><i class="ph-bold ph-heart-beat"></i></div>
                <div>
                    <h1>ACS Digital</h1>
                    <span class="subtitle">Microárea 03 - Guarda-Mor</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <span class="nav-section-title">Navegação Principal</span>
                <a href="index.html" class="nav-item"><i class="ph ph-house"></i> Dashboard</a>
                <a href="familias.html" class="nav-item active"><i class="ph ph-users"></i> Famílias</a>
                <a href="visitas.html" class="nav-item"><i class="ph ph-map-pin"></i> Visitas</a>
                <a href="metas.html" class="nav-item"><i class="ph ph-chart-bar"></i> Indicadores</a>
            </nav>

            <div class="sidebar-footer">
                <a href="configuracoes.html" class="nav-item"><i class="ph ph-gear"></i> Configurações</a>
                <div class="sync-status">
                    <i class="ph-bold ph-cloud-check"></i>
                    <span>Sincronizado (Offline)</span>
                </div>
            </div>
        </aside>

        <main class="main-content">
            
            <header class="main-header" style="margin-bottom: 24px;">
                <div class="welcome-zone" style="display: flex; align-items: center; gap: 16px;">
                    <button onclick="window.history.back()" class="btn-secondary" style="padding: 8px 12px;">
                        <i class="ph-bold ph-arrow-left"></i>
                    </button>
                    <div>
                        <h2>Detalhes da Família</h2>
                        <p class="current-date">Prontuário e histórico do domicílio</p>
                    </div>
                </div>
            </header>

            <div id="dadosFamilia" class="compact-card" style="padding: 24px;">
                <p style="color: var(--text-muted);">Carregando detalhes...</p>
            </div>

            <section class="split-section" style="margin-top: 32px; gap: 32px;">
                
                <div class="split-block" style="flex: 1;">
                    <div class="section-header" style="margin-bottom: 16px;">
                        <h3>Composição Familiar</h3>
                    </div>
                    <div id="listaMembros" class="table-container"></div>
                </div>

                <div class="split-block" style="flex: 1;">
                    <div class="section-header" style="margin-bottom: 16px;">
                        <h3>Histórico de Visitas</h3>
                        <button id="btnNovaVisitaDetalhe" class="btn-secondary" style="padding: 6px 12px;">
                            <i class="ph-bold ph-plus"></i> Nova Visita
                        </button>
                    </div>
                    <div id="historicoVisitasFamilia" class="priority-list"></div>
                </div>
            </section>

        </main>
    </div> <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof mostrarFamiliaDetalhe === 'function') mostrarFamiliaDetalhe();
            if (typeof renderizarMembrosDetalhe === 'function') renderizarMembrosDetalhe();
        });
    </script>
</body>
</html>
