<!DOCTYPE html>

    <button onclick="window.location.href='notificacoes.html'" id="btn_notif" style="position:relative;">🔔 Notificações <span id="badgeNotif" style="display:none;background:#e53e3e;color:white;font-size:10px;font-weight:bold;border-radius:99px;padding:1px 6px;margin-left:4px;">0</span></button>
    <div class="nav-divisor"></div>
    <div class="nav-grupo">
      <button class="nav-grupo-btn" id="btn_familias" onclick="toggleGrupo('familias')"><span>👨‍👩‍👧 Famílias e Cidadãos</span><span class="seta">›</span></button>
      <div class="nav-submenu" id="sub_familias">
        <button onclick="window.location.href='familias_lista.html'">📋 Lista de Famílias</button>
        <button onclick="window.location.href='familias.html'">➕ Nova Família</button>
        <button onclick="window.location.href='cidadaos_lista.html'">👤 Cidadãos</button>
        <button onclick="window.location.href='vacinacao.html'">💉 Vacinação</button>
        <button onclick="window.location.href='bolsa_familia.html'">💰 Bolsa Família</button>
      </div>
    </div>
    <div class="nav-grupo">
      <button class="nav-grupo-btn" id="btn_visitas" onclick="toggleGrupo('visitas')"><span>📅 Visitas</span><span class="seta">›</span></button>
      <div class="nav-submenu" id="sub_visitas">

        <button onclick="window.location.href='visitas.html'">➕ Nova Visita</button>

      </div>
    </div>
    <div class="nav-grupo">
      <button class="nav-grupo-btn" id="btn_relatorios" onclick="toggleGrupo('relatorios')"><span>📊 Relatórios e Metas</span><span class="seta">›</span></button>
      <div class="nav-submenu" id="sub_relatorios">
        <button onclick="window.location.href='relatorios.html'">📊 Relatório Consolidado</button>
        <button onclick="window.location.href='metas.html'">🎯 Metas Brasil 360</button>
      </div>
    </div>
    <div class="nav-grupo">
      <button class="nav-grupo-btn" id="btn_planejamento" onclick="toggleGrupo('planejamento')"><span>🗓️ Planejamento</span><span class="seta">›</span></button>
      <div class="nav-submenu" id="sub_planejamento">
        <button onclick="window.location.href='agenda.html'">📅 Agenda</button>

      <button class="nav-grupo-btn" id="btn_config" onclick="toggleGrupo('config')"><span>⚙️ Configurações</span><span class="seta">›</span></button>

  </nav>
  <div class="user">
    <img id="sidebarFotoPerfil" src="gabriela.jpg" alt="Foto" style="width:40px;height:40px;min-width:40px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.25);flex-shrink:0;">
    <div><strong id="sidebarNomePerfil">Gabriela Almeida</strong><span id="sidebarMicroarea">Microárea 03</span></div>
  </div>
</aside>
<div class="main">
  <div class="page-actions">
    <h1>Cidadãos cadastrados</h1>
    <div class="page-actions-btns no-print">
      <button onclick="window.location.href='index.html'" class="btn btn-home">🏠 Início</button>
      <button onclick="window.history.back()" class="btn btn-secondary">⬅️ Voltar</button>
      <button onclick="window.location.href='mapa.html'" class="btn btn-primary">🗺️ Mapa</button>
      <button onclick="window.print()" class="btn btn-success">🖨️ Imprimir</button>
    </div>
  </div>

  <!-- FILTROS -->
  <div class="box no-print" style="margin-bottom:16px; padding:16px;">
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;">
      <input type="text" id="filtroTextoCid" placeholder="🔍 Buscar por nome..." oninput="filtrarCidadaos()" style="padding:9px 12px; border:1px solid #cbd5e0; border-radius:6px; font-size:14px;">
      <select id="filtroSexoCid" onchange="filtrarCidadaos()" style="padding:9px 12px; border:1px solid #cbd5e0; border-radius:6px; font-size:14px;">
        <option value="">👤 Todos os sexos</option>
        <option value="Masculino">♂ Masculino</option>
        <option value="Feminino">♀ Feminino</option>
      </select>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr auto; gap:10px; align-items:center;">
      <select id="filtroCondCid" onchange="filtrarCidadaos()" style="padding:9px 12px; border:1px solid #cbd5e0; border-radius:6px; font-size:14px;">
        <option value="">🏥 Todas as condições</option>
        <option value="hipertensao">❤️ Hipertenso</option>
        <option value="diabetes">🩸 Diabético</option>
        <option value="gestante">🤰 Gestante</option>
        <option value="acamado">🛏️ Acamado</option>
        <option value="domiciliado">🏠 Domiciliado</option>
      </select>
      <select id="filtroIdadeCid" onchange="filtrarCidadaos()" style="padding:9px 12px; border:1px solid #cbd5e0; border-radius:6px; font-size:14px;">
        <option value="">📅 Todas as idades</option>
        <option value="crianca">👶 Crianças (< 2 anos)</option>
        <option value="idoso">👴 Idosos (60+)</option>
      </select>
      <button onclick="limparFiltrosCid()" class="btn btn-secondary" style="white-space:nowrap;">✖ Limpar</button>
    </div>
    <div style="margin-top:10px; font-size:13px; color:#718096;" id="contadorCidadaos"></div>
  </div>

  <p style="color: #718096; margin-bottom: 20px;">Abaixo estão todas as pessoas cadastradas na sua microárea.</p>
  <div id="listaCidadaos"></div>
</div>

<script src="script.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    // 1. Verifica se viemos da tela de Metas com um filtro específico
    const filtroMeta = localStorage.getItem("filtroGrupo");
    
    if (filtroMeta) {
      // Se viemos das metas, usamos a função de filtro global
      mostrarCidadaosGeral(filtroMeta);
      localStorage.removeItem("filtroGrupo"); // Limpa para não filtrar sempre
    } else {
      // Se abrimos direto, mostra todos
      mostrarCidadaosGeral();
    }
  });

  // Função para os filtros manuais do topo da página
  function filtrarCidadaos() {
    const texto = document.getElementById("filtroTextoCid").value.toLowerCase();
    const sexo = document.getElementById("filtroSexoCid").value;
    const condicao = document.getElementById("filtroCondCid").value;
    const idadeFiltro = document.getElementById("filtroIdadeCid").value;

    // Esta função deve estar no seu script.js ou definida aqui
    // Se quiser usar a que já existe no script.js, basta chamá-la passando os parâmetros
    // ou deixar que o script.js leia esses campos diretamente.
    mostrarCidadaosGeral(); 
  }

  function limparFiltrosCid() {
    document.getElementById("filtroTextoCid").value = "";
    document.getElementById("filtroSexoCid").value = "";
    document.getElementById("filtroCondCid").value = "";
    document.getElementById("filtroIdadeCid").value = "";
    mostrarCidadaosGeral();
  }
</script>
</body>
</html>
