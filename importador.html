<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Importador de Dados - ACS Digital</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .box { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .log-box { margin-top: 20px; font-size: 14px; color: #4a5568; text-align: left; background: #edf2f7; padding: 15px; border-radius: 6px; }
    </style>
</head>
<body style="padding-bottom: 80px;">

<main class="main">
    <div class="page-actions">
        <h1>📥 Importador de Dados</h1>
        <button onclick="window.location.href='index.html'" class="btn btn-secondary">⬅️ Voltar</button>
    </div>

    <div class="box">
        <h3 style="color: #1a365d; border-bottom: 2px solid #edf2f7; padding-bottom: 10px; margin-bottom: 15px;">1. Importar Pacientes (e-SUS)</h3>
        <p style="font-size: 14px; color: #4a5568; margin-bottom: 15px;">Selecione os dois ficheiros CSV para gerar o seu Backup Oficial.</p>

        <label style="font-weight: bold; font-size: 14px; display: block; color: #2d3748;">Ficheiro de Visitas (controle_visitas...csv)</label>
        <input type="file" id="csvVisitas" accept=".csv" style="margin-bottom: 15px; width: 100%; padding: 8px; border: 1px dashed #cbd5e0; background: #f8fafc; border-radius: 4px;">

        <label style="font-weight: bold; font-size: 14px; display: block; color: #2d3748;">Ficheiro de Patologias (familias_patologia...csv)</label>
        <input type="file" id="csvPatologia" accept=".csv" style="margin-bottom: 15px; width: 100%; padding: 8px; border: 1px dashed #cbd5e0; background: #f8fafc; border-radius: 4px;">

        <button onclick="processarCSVs()" style="background: #3182ce; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%;">Gerar Arquivo de Backup (JSON)</button>

        <div id="log" class="log-box" style="display: none;"></div>
    </div>

    <div class="box" style="border-left: 4px solid #38a169;">
        <h3 style="color: #22543d; border-bottom: 2px solid #edf2f7; padding-bottom: 10px; margin-bottom: 15px;">2. Atualizar "Dias Sem Visita"</h3>
        <p style="font-size: 14px; color: #4a5568; margin-bottom: 15px;">
            Selecione a planilha <b>CSV</b> (Paciente ; Dias Sem Visita). O sistema vai gerar uma visita histórica para corrigir o atraso de todos.
        </p>

        <div style="border: 2px dashed #cbd5e0; padding: 15px; border-radius: 8px; text-align: center; background: #f0fff4;">
            <input type="file" id="arquivoCsvDias" accept=".csv" style="margin-bottom: 15px; width: 100%;">
            <br>
            <button onclick="importarDiasSemVisita()" style="background: #38a169; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%;">
                ⚙️ Processar Planilha de Atrasos
            </button>
        </div>

        <div id="resultadoImportacao" style="margin-top: 20px; font-size: 14px;"></div>
    </div>
</main>

<script>
    // =======================================================
    // LÓGICA 1: O SEU CÓDIGO ORIGINAL DE GERAR BACKUP JSON
    // =======================================================
    function lerArquivo(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = e => resolve(e.target.result);
            reader.onerror = e => reject(e);
            reader.readAsText(file, 'UTF-8');
        });
    }

    async function processarCSVs() {
        const fileVisitas = document.getElementById('csvVisitas').files[0];
        const filePatologia = document.getElementById('csvPatologia').files[0];
        const logEl = document.getElementById('log');

        if (!fileVisitas || !filePatologia) {
            alert("Por favor, selecione os dois ficheiros CSV!");
            return;
        }

        logEl.style.display = "block";
        logEl.innerHTML = "A processar ficheiros...<br>";

        try {
            const textoVisitas = await lerArquivo(fileVisitas);
            const textoPatologia = await lerArquivo(filePatologia);

            // Processar Patologias
            const linhasPatologia = textoPatologia.split('\n');
            const mapaDoencas = {};
            
            for (let i = 1; i < linhasPatologia.length; i++) {
                if(!linhasPatologia[i].trim()) continue;
                const colunas = linhasPatologia[i].split(';');
                if(colunas.length >= 2) {
                    const nomeUpper = colunas[0].trim().toUpperCase();
                    mapaDoencas[nomeUpper] = colunas[1].trim().toUpperCase();
                }
            }

            // Processar Visitas
            const linhasVisitas = textoVisitas.split('\n');
            const familiasMap = {};
            const membrosArray = [];
            let contadorFamilias = 0;
            let contadorMembros = 0;

            for (let i = 1; i < linhasVisitas.length; i++) {
                if(!linhasVisitas[i].trim()) continue;
                const colunas = linhasVisitas[i].split(';');
                
                if(colunas.length < 6) continue;

                const idPaciente = colunas[0].trim();
                const nome = colunas[1].trim();
                const cns = colunas[2].trim();
                let dataNasc = colunas[3].trim(); // Formato DD/MM/YYYY
                const numFamilia = parseInt(colunas[4].trim()) || 0;
                const isResp = colunas[5].trim() === "1";

                if(dataNasc && dataNasc.includes('/')) {
                    const partes = dataNasc.split('/');
                    dataNasc = `${partes[2]}-${partes[1]}-${partes[0]}`;
                }

                // Identificar Família
                const idFamiliaInt = 10000 + numFamilia;
                if (!familiasMap[idFamiliaInt]) {
                    familiasMap[idFamiliaInt] = {
                        id: idFamiliaInt,
                        numeroFamilia: numFamilia,
                        responsavel: nome,
                        bairro: "Guarda-Mor",
                        dataCadastro: new Date().toISOString().split('T')[0]
                    };
                    contadorFamilias++;
                }
                if (isResp) {
                    familiasMap[idFamiliaInt].responsavel = nome;
                }

                // Cruzar com Patologias
                const condicoesRaw = mapaDoencas[nome.toUpperCase()] || "";
                let doencasLista = [];
                let fuma = "Não", alcool = "Não
