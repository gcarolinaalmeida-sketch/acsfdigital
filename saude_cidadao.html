<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visão Geral de Saúde - ACS Digital</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon"><i class="ph-bold ph-heart-beat"></i></div>
                <div>
                    <h1>ACS Digital</h1>
                    <span class="subtitle">Microárea 03 - Guarda-Mor</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item"><i class="ph ph-house"></i> Dashboard</a>
                <a href="familias.html" class="nav-item"><i class="ph ph-users"></i> Famílias</a>
                <a href="visitas.html" class="nav-item"><i class="ph ph-map-pin"></i> Visitas</a>
            </nav>
            <div class="sidebar-footer">
                <a href="configuracoes.html" class="nav-item"><i class="ph ph-gear"></i> Configurações</a>
            </div>
        </aside>

        <main class="main-content">
            
            <header class="main-header">
                <div class="welcome-zone">
                    <button onclick="window.history.back()" class="btn-secondary" style="margin-bottom: 12px;">
                        <i class="ph ph-arrow-left"></i> Voltar
                    </button>
                    <h2>Prontuário do Cidadão</h2>
                </div>
            </header>

            <div class="compact-card" style="padding: 24px;">
                <div id="cidadaoHeader">
                    <p style="color: var(--text-muted);">Carregando dados...</p>
                </div>
            </div>

            <div class="tabs-container">
                <button class="tab-button tsb active" onclick="trocarTab('clinico')">Clínico</button>
                <button class="tab-button tsb" onclick="trocarTab('medicamentos')">Medicamentos</button>
                <button class="tab-button tsb" onclick="trocarTab('exames')">Exames</button>
            </div>

            <div id="tab-clinico" class="tab-content active">
                <div class="compact-card">
                    <h4>Condições de Saúde</h4>
                    <div id="listaCondicoes"></div>
                </div>
            </div>

            <div id="tab-medicamentos" class="tab-content">
                <div class="compact-card">
                    <h4>Receitas Ativas</h4>
                    <div id="listaReceitas"></div>
                </div>
            </div>

            <div id="tab-exames" class="tab-content">
                <div class="compact-card">
                    <h4>Histórico de Exames</h4>
                    <div id="listaExames"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
        function trocarTab(tab) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tsb').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
