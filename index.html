<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACS Digital - Painel de Controle</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

    <div class="app-container">
        
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon"><i class="ph-bold ph-heart-beat"></i></div>
                <div>
                    <h1>ACS Digital</h1>
                    <span class="subtitle">Microárea 03 - Guarda-Mor</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <span class="nav-section-title">Navegação Principal</span>
                <a href="#dashboard" class="nav-item active"><i class="ph ph-house"></i> Dashboard</a>
                <a href="familias_lista.html" class="nav-item"><i class="ph ph-users"></i> Famílias</a>
                <a href="visitas_lista.html" class="nav-item"><i class="ph ph-map-pin"></i> Visitas</a>
                <a href="metas.html" class="nav-item"><i class="ph ph-chart-bar"></i> Indicadores</a>
                
                <span class="nav-section-title">Atalhos Rápidos</span>
                <a href="saude_cidadao.html" class="nav-item"><i class="ph ph-user-plus"></i> Novo Cadastro</a>
                <a href="saude_cidadao.html" class="nav-item"><i class="ph ph-clipboard-text"></i> Ficha de Sintomas</a>
            </nav>

            <div class="sidebar-footer">
                <a href="configuracoes.html" class="nav-item"><i class="ph ph-gear"></i> Configurações</a>
                <div class="sync-status">
                    <i class="ph-bold ph-cloud-check"></i>
                    <span>Sincronizado (Offline)</span>
                </div>
            </div>
        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="main-content">
            
            <!-- DASHBOARD -->
            <div id="dashboard" class="page-section active">
                <header class="main-header">
                    <div class="welcome-zone">
                        <h2>Bom dia.</h2>
                        <p class="current-date" id="live-date">Sábado, 20 de Junho</p>
                    </div>
                </header>

                <section class="overview-section">
                    <div class="compact-card">
                        <span class="card-label">Famílias</span>
                        <span class="card-value" id="totalFamilias">0</span>
                    </div>
                    <div class="compact-card">
                        <span class="card-label">Cidadãos</span>
                        <span class="card-value" id="totalCidadaos">0</span>
                    </div>
                    <div class="compact-card">
                        <span class="card-label">Visitas</span>
                        <span class="card-value" id="totalVisitas">0</span>
                    </div>
                </section>
            </div>

        </main>
    </div>

    <!-- SCRIPT DE CARREGAMENTO -->
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Navegação entre abas e seções
            const menuLinks = document.querySelectorAll('.nav-item');
            const pageSections = document.querySelectorAll('.page-section');

            function navigateTo(targetId) {
                const targetSection = document.querySelector(targetId);
                if (!targetSection) return;
                pageSections.forEach(s => { s.style.display = 'none'; s.classList.remove('active'); });
                targetSection.style.display = 'block';
                setTimeout(() => targetSection.classList.add('active'), 10);
                menuLinks.forEach(item => { 
                    item.classList.remove('active'); 
                    if (item.getAttribute('href') === targetId) item.classList.add('active'); 
                });
            }

            menuLinks.forEach(link => {
                link.addEventListener('click', function(event) {
                    const targetId = this.getAttribute('href');
                    if (targetId.startsWith('#')) { event.preventDefault(); navigateTo(targetId); }
                });
            });
        });
    </script>
</body>
</html>
