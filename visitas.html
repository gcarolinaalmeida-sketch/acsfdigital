<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registrar Visita - ACS Digital</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

    <div class="app-container">
        
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon"><i class="ph-bold ph-heart-beat"></i></div>
                <div><h1>ACS Digital</h1><span class="subtitle">Microárea 03</span></div>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item"><i class="ph ph-house"></i> Dashboard</a>
                <a href="familias.html" class="nav-item"><i class="ph ph-users"></i> Famílias</a>
                <a href="visitas.html" class="nav-item active"><i class="ph ph-map-pin"></i> Visitas</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <div class="welcome-zone">
                    <h2>Nova Visita</h2>
                    <p class="current-date">Preenchimento rápido para o e-SUS</p>
                </div>
            </header>

            <div class="wizard-wrap">
                <div class="steps-bar" style="margin-bottom: 32px;">
                    <div class="step-item active">1. Domicílio</div>
                    <div class="step-item">2. Desfecho</div>
                    <div class="step-item">3. Conclusão</div>
                </div>

                <div class="compact-card" style="padding: 32px;">
                    <form id="formVisita">
                        <div class="form-section">
                            <label style="font-weight: 600; margin-bottom: 8px; display: block;">Família visitada</label>
                            <select id="familiaVisita" onchange="aoSelecionarFamilia()" style="width: 100%; padding: 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); margin-bottom: 20px;">
                                <option value="">Selecione a família...</option>
                            </select>
                        </div>

                        <div class="form-grid">
                            <div class="input-group">
                                <label>Data</label>
                                <input type="date" id="dataVisita">
                            </div>
                            <div class="input-group">
                                <label>Turno</label>
                                <select id="turnoVisita">
                                    <option value="Manhã">Manhã</option>
                                    <option value="Tarde">Tarde</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-section" style="margin-top: 20px;">
                            <label>Desfecho</label>
                            <div style="display: flex; gap: 10px; margin-top: 8px;">
                                <button type="button" class="btn-action" onclick="selecionarDesfecho('Visita Realizada')">✅ Realizada</button>
                                <button type="button" class="btn-action" onclick="selecionarDesfecho('Ausente')">⚠️ Ausente</button>
                            </div>
                        </div>

                        <div class="form-actions" style="margin-top: 32px; display: flex; gap: 12px;">
                            <button type="button" class="btn-secondary" onclick="window.location.href='index.html'">Cancelar</button>
                            <button type="button" class="btn-primary" onclick="salvarVisita()">Salvar Registro</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
