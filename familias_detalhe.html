<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhe da Família - ACS Digital</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar (Mesma do index.html) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon"><i class="ph-bold ph-heart-beat"></i></div>
                <div><h1>ACS Digital</h1><span class="subtitle">Microárea 03</span></div>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item"><i class="ph ph-house"></i> Dashboard</a>
                <a href="familias.html" class="nav-item active"><i class="ph ph-users"></i> Famílias</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <div class="welcome-zone">
                    <button onclick="window.history.back()" class="btn-secondary" style="margin-bottom:10px;"><i class="ph ph-arrow-left"></i> Voltar</button>
                    <h2>Detalhes da Família</h2>
                </div>
            </header>

            <!-- Card de Dados da Família -->
            <div id="dadosFamilia" class="compact-card" style="padding: 24px;">
                <!-- O script.js injetará os dados aqui -->
            </div>

            <section class="split-section" style="margin-top: 24px;">
                <div class="split-block">
                    <h4>Membros da família</h4>
                    <div id="listaMembros" class="table-container"></div>
                </div>
                <div class="split-block">
                    <h4>Histórico de Visitas</h4>
                    <div id="historicoVisitasFamilia" class="priority-list"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
