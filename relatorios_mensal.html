<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!-- Força o modo tela cheia no iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ACS Digital">
<!-- Ícone para a tela de início do iPad -->
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2966/2966327.png">
  <meta charset="UTF-8">
  <title>Relatório Mensal - ACS Digital</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Configuração para esconder botões na impressão */
    @media print {
        .no-print { display: none !important; }
        body { background: white; padding: 0; }
        .main { margin: 0; width: 100%; }
        .box { box-shadow: none; border: 1px solid #e2e8f0; page-break-inside: avoid; }
    }
  </style>
</head>
<body>

<div class="main" style="margin-left:0; width:100%;">
  <div class="page-actions no-print">
      <h1>📊 Relatório Consolidado</h1>
      <div class="page-actions-btns">
          <button onclick="window.location.href='index.html'" class="btn btn-home">🏠 Início</button>
          <button onclick="window.print()" class="btn btn-primary">🖨️ Imprimir / PDF</button>
      </div>
  </div>
  
  <p class="no-print" style="color: #718096; margin-bottom: 20px;">Este relatório resume automaticamente os seus indicadores para o e-SUS e Brasil 360.</p>

  <div id="conteudoRelatorio"></div>
</div>

<script src="script.js"></script>
</body>
</html>
